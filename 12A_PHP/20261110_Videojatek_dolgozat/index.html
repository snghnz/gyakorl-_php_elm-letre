<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videójáték-katalógus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container py-5">
        <!-- Fejléc -->
        <h1 class="text-center mb-4">Videójáték-katalógus</h1>

        <!-- Kereső űrlap -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form action="" method="get" class="row g-3 align-items-end">
                    <div class="col-md-6">
                        <label class="form-label small">Keresés címre</label>
                        <input class="form-control" type="text" name="title" placeholder="pl. Portal">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small">Műfaj</label>
                        <select class="form-select" name="genre">
                            <option value="">Minden műfaj</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input class="btn btn-primary w-100" type="submit" value="Szűrés">
                    </div>
                </form>
            </div>
        </div>

        <!-- Kártyák (soronként 4) -->
        <div class="row">

            <!-- Egy játék kártyája -->
            <div class="col-sm-6 col-md-4 col-lg-3 my-2">
                <div class="card h-100 shadow-sm">
                    <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/620/header.jpg" alt="Portal 2" class="card-img-top">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title mb-1">Portal 2</h5>
                        <p class="text-success fw-semibold small mb-2">Puzzle</p>
                        <p class="text-body-secondary small mb-2">Valve | 2011</p>
                        <p class="small">Oldj meg fizikai fejtörőket egy portálfegyverrel az Aperture Science elhagyatott laborjaiban.</p>
                        <div class="mt-auto">
                            <p class="text-body-secondary small mb-1">Platformok:</p>
                            <div>
                                <span class="badge bg-primary me-1 mb-1">PC</span>
                                <span class="badge bg-primary me-1 mb-1">PlayStation 3</span>
                                <span class="badge bg-primary me-1 mb-1">Xbox 360</span>
                                <span class="badge bg-primary me-1 mb-1">Nintendo Switch</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Ha nincs találat, a kártyák helyett ez jelenik meg:
        <div class="alert alert-warning text-center">Nincs a feltételeknek megfelelő játék.</div>
        -->
    </div>
</body>
</html>
